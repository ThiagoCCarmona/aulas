<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Graduation Cap Icon -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cap Top Diamond -->
    <path d="M32 17 L54 26 L32 35 L10 26 Z" fill="#ffffff" stroke-width="1.5" />
    
    <!-- Cap Lower Band -->
    <path d="M17 30.5 V41 C17 41 22 47 32 47 C42 47 47 41 47 41 V30.5" stroke-width="3.5" />
    
    <!-- Tassel -->
    <path d="M47 30 V44" stroke-width="2.5" />
    <circle cx="47" cy="45.5" r="2" fill="#ffffff" stroke="none" />
  </g>
</svg>
